<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dato no válido — GranjaManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card shadow-sm" style="max-width: 480px; width: 100%;">
        <div class="card-body text-center py-4">
            <i class="bi bi-exclamation-triangle-fill text-warning fs-1 d-block mb-3"></i>
            <h5 class="fw-bold mb-2">Dato no válido</h5>
            <p class="text-muted mb-3">
                Revisa que las fechas y los números introducidos tengan un formato correcto
                (por ejemplo, usa el punto para los decimales: 12.5).
            </p>
            <button onclick="history.back()" class="btn btn-success btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver e intentarlo de nuevo
            </button>
        </div>
    </div>
</div>
</body>
</html>
