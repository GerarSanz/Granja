<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GranjaManager — Acceso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-sm" style="width:100%;max-width:380px;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-tree-fill text-success" style="font-size:2.5rem;"></i>
                <h4 class="mt-2 mb-0 fw-bold text-success">GranjaManager</h4>
                <small class="text-muted">Gestión ganadera ecológica</small>
            </div>
            {% if request.state.demo_mode %}
            <div class="alert py-2 text-center" style="background:#6f42c1;color:#fff;">
                <i class="bi bi-eye-fill me-1"></i> Demo — entra con
                <code class="text-white">demo</code> / <code class="text-white">demo1234</code>
            </div>
            {% endif %}
            {% if error %}
            <div class="alert alert-danger py-2">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
            </div>
            {% endif %}
            <form method="post" action="/auth/login">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
